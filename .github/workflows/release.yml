name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and attach APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - run: sdkmanager "ndk;27.0.12077973"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true
      - run: flutter pub get

      # The Gradle build refuses unsigned releases by design
      # (see android/app/build.gradle.kts), so the release APK is only
      # produced when the signing secrets are configured.
      - name: Configure release signing
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 --decode > android/keystore/ez-remote-release.jks
          {
            echo "storeFile=../keystore/ez-remote-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        run: flutter build apk --release

      - name: Build debug APK
        if: env.KEYSTORE_B64 == ''
        run: flutter build apk --debug

      - name: Create GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            apk=build/app/outputs/flutter-apk/app-release.apk
            note="Signed with the release keystore."
          else
            apk=build/app/outputs/flutter-apk/app-debug.apk
            note="Debug-signed build. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets to publish release-signed APKs."
          fi
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "$GITHUB_REF_NAME" \
            --notes "APK build of $GITHUB_SHA.

          $note" || gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
