name: iOS / iPad

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      export_method:
        description: Distribution method used when Apple signing secrets are configured
        type: choice
        default: development
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app
    runs-on: macos-14
    timeout-minutes: 45
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPORT_METHOD: ${{ github.event.inputs.export_method || vars.IOS_EXPORT_METHOD || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build unsigned app
        run: flutter build ios --release --no-codesign

      - name: Archive unsigned app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: ezmusicproductionremote-ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.zip
          if-no-files-found: error
          retention-days: 30

      - name: Import Apple signing identity
        if: env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != ''
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          PROFILE_NAME=$(security cms -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" \
            | plutil -extract Name raw -)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: env.PROFILE_NAME != ''
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ezmusicproduction.ezmusicproductionRemote</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          export FLUTTER_XCODE_CODE_SIGN_STYLE=Manual
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload signed IPA
        if: env.PROFILE_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: ezmusicproductionremote-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
